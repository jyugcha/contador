
```html
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta regresiva</title>
</head>
<body>
  <h1>Faltan</h1>
  <div id="contador" style="font: bold 2rem sans-serif;"></div>

  <script>
    const fecha = new Date("2027-09-25T18:30:00-05:00").getTime();
    const salida = document.getElementById("contador");

    function actualizar() {
      const restante = fecha - Date.now();

      if (restante <= 0) {
        salida.textContent = "¡Llegó el momento!";
        return;
      }

      const dias = Math.floor(restante / 86400000);
      const horas = Math.floor(restante / 3600000) % 24;
      const minutos = Math.floor(restante / 60000) % 60;
      const segundos = Math.floor(restante / 1000) % 60;

      salida.textContent = `${dias} días, ${horas} h, ${minutos} min, ${segundos} s`;
    }

    actualizar();
    setInterval(actualizar, 1000);
  </script>
</body>
</html>
